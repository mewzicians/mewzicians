<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">mewzicians</title>
  <desc id="desc">Three project windows on one workbench: a hearing waveform becoming a reviewed note, an office tower being climbed, and a folder of skill cards. Decorative artwork.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c1c"/>
      <stop offset="0.5" stop-color="#101833"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16203c"/>
      <stop offset="1" stop-color="#0e152b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="2"/>

  <ellipse cx="240" cy="190" rx="170" ry="120" fill="#2dd4bf" fill-opacity="0.09" filter="url(#softGlow)"/>
  <ellipse cx="640" cy="190" rx="170" ry="120" fill="#f0a020" fill-opacity="0.08" filter="url(#softGlow)"/>
  <ellipse cx="1040" cy="190" rx="170" ry="120" fill="#a78bfa" fill-opacity="0.10" filter="url(#softGlow)"/>

  <!-- The workbench line joining the three projects -->
  <path d="M120 318 H1160" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 10"/>
  <g fill="#94a3b8" fill-opacity="0.45">
    <circle cx="240" cy="318" r="4"/><circle cx="640" cy="318" r="4"/><circle cx="1040" cy="318" r="4"/>
  </g>

  <!-- 1. Hearing Compiler: audio becomes a reviewed note, one item still flagged -->
  <g transform="translate(90 52)">
    <rect width="300" height="236" rx="16" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="22" cy="20" r="5" fill="#2dd4bf" fill-opacity="0.8"/><circle cx="38" cy="20" r="5" fill="#2dd4bf" fill-opacity="0.45"/><circle cx="54" cy="20" r="5" fill="#2dd4bf" fill-opacity="0.25"/>
    <g transform="translate(26 92)" fill="#2dd4bf" filter="url(#glow)">
      <rect x="0" y="-10" width="8" height="20" rx="4"/><rect x="16" y="-28" width="8" height="56" rx="4"/>
      <rect x="32" y="-18" width="8" height="36" rx="4"/><rect x="48" y="-40" width="8" height="80" rx="4"/>
      <rect x="64" y="-22" width="8" height="44" rx="4"/><rect x="80" y="-32" width="8" height="64" rx="4"/>
      <rect x="96" y="-12" width="8" height="24" rx="4"/>
    </g>
    <path d="M140 92 H164" stroke="#5eead4" stroke-opacity="0.6" stroke-width="2.5" stroke-dasharray="4 6"/>
    <path d="M160 86 L168 92 L160 98" fill="none" stroke="#5eead4" stroke-opacity="0.8" stroke-width="2.5"/>
    <g fill="#e2f3f5" fill-opacity="0.7">
      <rect x="182" y="58" width="94" height="8" rx="4"/><rect x="182" y="76" width="76" height="8" rx="4"/>
      <rect x="182" y="112" width="88" height="8" rx="4"/>
    </g>
    <rect x="176" y="90" width="106" height="16" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.7"/>
    <path d="M184 103 L189 94 L194 103 Z" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="200" y="95" width="70" height="6" rx="3" fill="#fde68a" fill-opacity="0.8"/>
    <text x="26" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5eead4">Hearing Compiler</text>
    <text x="26" y="222" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">evidence-linked AI notes</text>
  </g>

  <!-- 2. OfficeWars: climbing the tower floor by floor -->
  <g transform="translate(490 52)">
    <rect width="300" height="236" rx="16" fill="url(#card)" stroke="#f0a020" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="22" cy="20" r="5" fill="#f0a020" fill-opacity="0.8"/><circle cx="38" cy="20" r="5" fill="#f0a020" fill-opacity="0.45"/><circle cx="54" cy="20" r="5" fill="#f0a020" fill-opacity="0.25"/>
    <g transform="translate(90 36)">
      <g fill="#141a36" stroke="#3a4270" stroke-width="1.5">
        <rect x="0" y="0" width="120" height="17" rx="3"/><rect x="0" y="21" width="120" height="17" rx="3"/>
      </g>
      <rect x="0" y="42" width="120" height="17" rx="3" fill="#16302a" stroke="#42d392" stroke-width="2" filter="url(#glow)"/>
      <rect x="44" y="45" width="32" height="11" rx="3" fill="#f0a020"/>
      <g fill="#1e1d2c" stroke="#f0a020" stroke-opacity="0.6" stroke-width="1.5">
        <rect x="0" y="63" width="120" height="17" rx="3"/><rect x="0" y="84" width="120" height="17" rx="3"/><rect x="0" y="105" width="120" height="17" rx="3"/>
      </g>
      <g fill="#f0a020" fill-opacity="0.75">
        <rect x="10" y="68" width="14" height="7" rx="1.5"/><rect x="34" y="68" width="14" height="7" rx="1.5"/><rect x="58" y="68" width="14" height="7" rx="1.5"/><rect x="82" y="68" width="14" height="7" rx="1.5"/>
        <rect x="10" y="89" width="14" height="7" rx="1.5"/><rect x="34" y="89" width="14" height="7" rx="1.5"/><rect x="58" y="89" width="14" height="7" rx="1.5"/><rect x="82" y="89" width="14" height="7" rx="1.5"/>
        <rect x="10" y="110" width="14" height="7" rx="1.5"/><rect x="34" y="110" width="14" height="7" rx="1.5"/><rect x="58" y="110" width="14" height="7" rx="1.5"/><rect x="82" y="110" width="14" height="7" rx="1.5"/>
      </g>
    </g>
    <text x="26" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f0a020">OfficeWars</text>
    <text x="26" y="222" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">a playable office autobattler</text>
  </g>

  <!-- 3. Skills Folder: a folder of skill cards for AI agents -->
  <g transform="translate(890 52)">
    <rect width="300" height="236" rx="16" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="22" cy="20" r="5" fill="#a78bfa" fill-opacity="0.8"/><circle cx="38" cy="20" r="5" fill="#a78bfa" fill-opacity="0.45"/><circle cx="54" cy="20" r="5" fill="#a78bfa" fill-opacity="0.25"/>
    <g transform="translate(78 46)">
      <rect x="10" y="0" width="30" height="40" rx="4" fill="#4ade80" fill-opacity="0.85" transform="rotate(-14 25 40)"/>
      <rect x="42" y="-6" width="30" height="40" rx="4" fill="#7dd3fc" fill-opacity="0.85" transform="rotate(-5 57 34)"/>
      <rect x="74" y="-8" width="30" height="40" rx="4" fill="#facc15" fill-opacity="0.85" transform="rotate(5 89 32)"/>
      <rect x="104" y="-2" width="30" height="40" rx="4" fill="#f87171" fill-opacity="0.85" transform="rotate(14 119 38)"/>
      <path d="M0 30 H52 L62 40 H144 V104 H0 Z" fill="#a78bfa" fill-opacity="0.9" filter="url(#glow)"/>
      <path d="M0 46 H144 V104 H0 Z" fill="#c4b5fd"/>
      <rect x="54" y="66" width="36" height="8" rx="4" fill="#4c1d95" fill-opacity="0.55"/>
    </g>
    <text x="26" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c4b5fd">Skills Folder</text>
    <text x="26" y="222" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">skills for AI coding agents</text>
  </g>
</svg>
